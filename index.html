<script>
/* オフラインでも学習を続けられるように Service Worker を登録する */
if('serviceWorker' in navigator){
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
/* 「アプリにする」「共有」は webapp-kit に任せる。
   Chrome ではインストール画面、iPhone / Mac の Safari では追加の手順を出す。
   インストールできる状態が変わったら、教科書の目次にある追加ボタンを出し直す */
WebAppKit.init({
  title: 'コアイメージ英語',
  text: '英単語・文法・句動詞を、丸暗記ではなくコアイメージから学べるアプリ'
});
WebAppKit.onChange(() => {
  if(typeof render === 'function' && state.tab === 'book' && !state.page) render();
});
</script>
